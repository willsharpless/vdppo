name: rraa-rl_torch
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.2.0
  - torchvision
  - torchaudio
  - pip:
      - gym==0.26.2         # or 0.21.0 for legacy compatibility
      - stable-baselines3
      - mujoco
      - dm_control
      - numpy==1.24.4
      - wandb
      - shimmy
      - imageio
      - imageio-ffmpeg
