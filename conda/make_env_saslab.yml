name: jaxrl
# name: jax_sbx
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Core JAX with CUDA 12
      - --find-links https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
      - jax[cuda12_pip]==0.4.26
      - nvidia-cudnn-cu12==8.9.2.26

      # JAX ecosystem (compatible versions)
      - flax
      - optax
      - chex
      - jaxopt
      - orbax-checkpoint
      
      # RL/Gym environments
      - brax
      - gymnax
      - gymnasium
      - mujoco
      - mujoco-mjx
      - dm-control
      - ogbench

      # Scientific computing
      - numpy==1.26.4  # JAX 0.4.26 needs numpy<2.0
      - scipy==1.11.4  # Compatible version
      
      # Distributions and utilities
      - distrax
      - tfp-nightly==0.26.0.dev20260113
      - einops==0.8.1
      - jax_dataclasses
      - jaxtyping
      
      # Visualization
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - imageio==2.37.2
      - imageio-ffmpeg==0.6.0
      - moviepy
      - colour==0.1.5
      - glfw==2.10.0
      - Pillow
      - opencv-python

      # ML experiment tracking
      - wandb==0.23.1
      - tensorboardX==2.6.4
      - sentry-sdk==2.49.0
      
      # CLI and utilities
      - cyclopts==4.4.5
      - loguru==0.7.3
      - ipdb==0.13.13
      - ipython==9.9.0
      - tqdm==4.67.1
      - requests
      - absl-py
      - etils

      # Data structures and parsing
      - attrs==25.4.0
      - PyYAML==6.0.3
      - lxml

      # NLP utilities
      - nltk==3.9.2
      - wordfreq==3.1.1

      - cattrs
      - emoji
      - cairosvg
      - rosbags
      - segment-anything
      - warp-lang

      # Git repositories (install these last)
      - git+https://github.com/oswinso/lovely_histogram.git@90d4e086121a09fb5df6560cc3ac695006540ed2
      - git+https://github.com/willsharpless/valtr.git@c6f6550f156297c3bc30135e80da79f12aaccf51
