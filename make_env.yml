name: rraa-rl
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cudatoolkit=12.1
  - pytorch=2.2.0
  - torchvision
  - torchaudio
  - pip:
      - gym==0.26.2         # or 0.21.0 for legacy compatibility
      - stable-baselines3
      - mujoco
      - dm_control
      - numpy
      - wandb
