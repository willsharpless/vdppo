name: rraa-rl_torch_jax_cpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.2.2+cu121
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torchvision
      - torchaudio
      - jax # CPU SUPPORT ONLY, pytorch+cuda & jax+cuda are incompatible
      - flax
      - brax
      - gymnax
      - chex
      - gym==0.26.2
      - stable-baselines3
      - mujoco
      - dm_control
      - numpy==1.24.4
      - wandb
      - shimmy
      - imageio
      - imageio-ffmpeg
      - einops
      - control
      - distrax
      - colour
